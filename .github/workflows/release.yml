name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          BIN_NAME="terminal-timer-${{ matrix.target }}${{ matrix.suffix }}"
          cp target/${{ matrix.target }}/release/terminal-timer${{ matrix.suffix }} "$BIN_NAME"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: terminal-timer-${{ matrix.target }}${{ matrix.suffix }}
          retention-days: 1

  create-release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: binaries/

      - name: Generate unified CHECKSUMS.txt
        shell: python
        run: |
          import hashlib
          import glob
          import os

          os.chdir('binaries')
          
          with open('../CHECKSUMS.txt', 'w') as out:
              for f in sorted(glob.glob('terminal-timer-*')):
                  with open(f, 'rb') as fh:
                      digest = hashlib.sha256(fh.read()).hexdigest()
                      out.write(f'{digest}  {f}\n')

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            binaries/*
            CHECKSUMS.txt
